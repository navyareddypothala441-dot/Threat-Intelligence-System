<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #071c31
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }


        .card {
            width: 100%;
            max-width: 440px;

            background: #071c31;

            border:
                1px solid #164e72;

            border-radius: 14px;

            padding: 32px;
        }


        h1 {
            text-align: center;

            margin-bottom: 7px;
        }


        .subtitle {
            text-align: center;

            color: #8ba7ba;

            margin-bottom: 25px;

            font-size: 12px;
        }


        label {
            display: block;

            font-size: 12px;

            color: #b9d2e3;

            margin-bottom: 6px;
        }


        input {
            width: 100%;

            background: #03111f;

            border:
                1px solid #1c4d6c;

            border-radius: 6px;

            padding: 11px;

            color: white;

            margin-bottom: 15px;
        }


        button {
            width: 100%;

            border: none;

            background: #059669;

            color: white;

            padding: 12px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }


        button:hover {
            background: #047857;
        }


        .login {
            text-align: center;

            margin-top: 18px;

            font-size: 12px;

            color: #8ba7ba;
        }


        .login a {
            color: #38bdf8;

            text-decoration: none;
        }


        .flash {
            padding: 9px;

            border-radius: 5px;

            margin-bottom: 14px;

            font-size: 12px;
        }


        .flash.error {
            background: #451a1a;

            color: #fecaca;
        }


        .flash.success {
            background: #052e16;

            color: #bbf7d0;
        }

    </style>

</head>


<body>


<div class="card">


    <h1>
        🛡️ Create Account
    </h1>


    <p class="subtitle">
        OSINT Threat Intelligence Platform
    </p>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div
                    class="
                        flash
                        {{ category }}
                    "
                >
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        method="POST"
        action="/auth/register"
    >


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            required
        >


        <button type="submit">
            Create Account
        </button>


    </form>


    <div class="login">

        Already registered?

        <a href="/auth/login">
            Login
        </a>

    </div>


</div>


</body>

</html>
