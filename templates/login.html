<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        OSINT Login
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #071c31
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .login-card {
            width: 100%;
            max-width: 420px;

            background: #071c31;

            border:
                1px solid #164e72;

            border-radius: 14px;

            padding: 32px;

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );
        }


        .logo {
            text-align: center;

            font-size: 38px;

            margin-bottom: 10px;
        }


        h1 {
            text-align: center;

            font-size: 24px;

            margin-bottom: 5px;
        }


        .subtitle {
            text-align: center;

            color: #8ba7ba;

            font-size: 13px;

            margin-bottom: 25px;
        }


        label {
            display: block;

            font-size: 12px;

            color: #b9d2e3;

            margin-bottom: 7px;
        }


        input {
            width: 100%;

            background: #03111f;

            border:
                1px solid #1c4d6c;

            border-radius: 6px;

            padding: 12px;

            color: white;

            margin-bottom: 17px;

            outline: none;
        }


        input:focus {
            border-color: #38bdf8;
        }


        button {
            width: 100%;

            border: none;

            background: #0284c7;

            color: white;

            padding: 12px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #0369a1;
        }


        .register {
            text-align: center;

            margin-top: 20px;

            color: #8ba7ba;

            font-size: 12px;
        }


        .register a {
            color: #38bdf8;

            text-decoration: none;
        }


        .flash {
            border-radius: 5px;

            padding: 10px;

            margin-bottom: 15px;

            font-size: 12px;
        }


        .flash.error {
            background: #451a1a;

            color: #fecaca;
        }


        .flash.success {
            background: #052e16;

            color: #bbf7d0;
        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="logo">
        🛡️
    </div>


    <h1>
       Threat Intelligence System
    </h1>


    <p class="subtitle">
        Secure Analyst Login
    </p>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div
                    class="
                        flash
                        {{ category }}
                    "
                >
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        method="POST"
        action="/auth/login"
    >


        <label>
            Username
        </label>


        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
            autocomplete="username"
        >


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
        >


        <button type="submit">
            🔐 Login
        </button>


    </form>


    <div class="register">

        Don't have an account?

        <a href="/auth/register">
            Register
        </a>

    </div>


</div>


</body>

</html>
